---
# =====================================================================
#  Site settings — enter YOUR node IPs / subnets / VIP (this file is a template)
#
#  Option 1 (recommended): answer prompts one value at a time; every value is
#  validated and this whole file is rewritten:
#      python3 scripts/setup-inventory.py
#  Option 2: edit this file and replace every <...> placeholder with a real value
#
#  preflight stops immediately (before any SSH) if a <...> placeholder is left,
#  an IP is malformed or duplicated, an IP/VIP is outside cluster_network_cidr,
#  or the VIP collides with a node IP
#
#  - pg_cluster must contain an odd number of hosts >= 3 (etcd quorum) — add/remove hosts freely
#  - the first host is the Leader at bootstrap and the keepalived MASTER (highest priority)
#  - host name = OS hostname + etcd/Patroni member name (a-z, 0-9, -)
#    (settle it before the first run — it is hard to change later)
#  - if you SSH over a different IP (e.g. a management network), set ansible_host to
#    that IP and add node_ip: <IP in the cluster subnet> under the host
# =====================================================================
all:
  children:
    pg_cluster:
      hosts:
        pg-node-1:
          ansible_host: "<IP-node-1>"          # e.g. 10.10.10.11
        pg-node-2:
          ansible_host: "<IP-node-2>"          # e.g. 10.10.10.12
        pg-node-3:
          ansible_host: "<IP-node-3>"          # e.g. 10.10.10.13

      vars:
        # subnet all nodes live in (used by firewalld + pg_hba) — every node IP must be inside it
        cluster_network_cidr: "<CIDR-cluster>"   # e.g. 10.10.10.0/24

        # application subnets allowed to reach HAProxy 5000/5001 and PostgreSQL (one or more)
        app_allowed_cidrs:
          - "<CIDR-app>"                       # e.g. 10.10.20.0/24

        # Virtual IP for applications — must be inside cluster_network_cidr and unused
        keepalived_enabled: true               # false = no VIP (apps connect to HAProxy on any node)
        keepalived_vip: "<VIP>"                # e.g. 10.10.10.10
        keepalived_vip_prefix: 24              # VIP prefix (normally the prefix of cluster_network_cidr)
        keepalived_router_id: 51               # virtual_router_id 1-255, unique among VRRP groups on the LAN
        # keepalived_interface: ens192         # usually not needed — the interface holding the node IP is used

  vars:
    ansible_user: ansible                      # SSH user with passwordless sudo
    ansible_become: true
